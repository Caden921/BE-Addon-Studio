<!DOCTYPE html>
<html lang="ko">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BE Addon Studio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>BE Addon Studio</h1>

    <p class="subtitle">
        Minecraft Bedrock Add-on Creator
    </p>

</header>

<main>

    <section class="card">

        <h2>Pack Information</h2>

        <label for="packName">Pack Name</label>
        <input
            type="text"
            id="packName"
            placeholder="e.g. My Addon">

        <label for="itemName">Item Name</label>
        <input
            type="text"
            id="itemName"
            placeholder="e.g. Ruby Sword">

<label for="identifier">Identifier</label>

<div class="identifier-input">
    <span>beas:</span>
    <input
        type="text"
        id="identifier"
        placeholder="ruby_sword">
</div>

<label for="maxStackSize">Max Stack Size</label>

<select id="maxStackSize">

    <option value="1">1</option>

    <option value="16">16</option>

    <option value="64" selected>64</option>

</select>

    </section>


    <section class="card">

        <h2>Item Texture</h2>

<input
    type="file"
    id="textureFile"
    accept=".png,image/png"
    hidden>

<div class="file-picker">

    <label
        for="textureFile"
        class="file-button">

        📁 Select PNG Texture

    </label>

    <div id="fileName">
        No file selected
    </div>

</div>

        <div class="preview">

            <img
                id="previewImage"
                src=""
                alt="Preview">

        </div>

    </section>


    <section class="card">

        <h2>Actions</h2>

        <button id="generateUUID">
            Generate UUID
        </button>

        <button id="generateAddon">
                Export .mcaddon
        </button>

    </section>


    <section class="card output-card">

        <h2>Output</h2>

        <textarea
            id="output"
            readonly
            placeholder="Generation results will appear here."></textarea>

    </section>

</main>

<footer class="watermark">

    <div class="wm-title">
        BE Addon Studio
    </div>

    <div class="wm-sub">
        Developed by Junseong Kim × ChatGPT
    </div>

    <div class="wm-version">
        Version v0.2 Alpha
    </div>

</footer>

<script src="script.js"></script>

</body>
</html>
