<!DOCTYPE html>
<html lang="ko">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PA Addon Studio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>PA Addon Studio</h1>

    <p class="subtitle">
        Minecraft Bedrock Add-on Creator
    </p>

</header>

<main>

    <section class="card">

        <h2>Pack Information</h2>

        <label for="packName">Pack Name</label>
        <input
            type="text"
            id="packName"
            placeholder="My Addon">

        <label for="itemName">Item Name</label>
        <input
            type="text"
            id="itemName"
            placeholder="Ruby Sword">

        <label for="identifier">Identifier</label>
        <input
            type="text"
            id="identifier"
            placeholder="pa:ruby_sword">

    </section>


    <section class="card">

        <h2>Item Texture</h2>

<input
    type="file"
    id="textureFile"
    accept=".png,image/png"
    hidden>

<div class="file-picker">

    <label
        for="textureFile"
        class="file-button">

        Select PNG Texture

    </label>

    <span id="fileName">
        No file selected
    </span>

</div>

        <div class="preview">

            <img
                id="previewImage"
                src=""
                alt="Preview">

            <p id="previewText">
                Select a PNG texture
            </p>

        </div>

    </section>


    <section class="card">

        <h2>Actions</h2>

        <button id="generateUUID">
            Generate UUID
        </button>

        <button id="generateAddon">
            Create .mcaddon
        </button>

    </section>


    <section class="card">

        <h2>Output</h2>

        <textarea
            id="output"
            readonly
            placeholder="Generation results will appear here."></textarea>

    </section>

</main>

<footer class="watermark">

    <div class="wm-title">
        PA Addon Studio
    </div>

    <div class="wm-sub">
        Developed by Junseong Kim × ChatGPT
    </div>

    <div class="wm-version">
        Version v0.2 Alpha
    </div>

</footer>

<script src="script.js"></script>

</body>
</html>
